<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}K-Shop{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar">
    <a class="brand" href="{{ url_for('index') }}">K-Shop</a>
    <div class="navlinks">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('products') }}">Shop</a>
        <a href="{{ url_for('cart') }}">Cart <span class="badge">{{ cart_count }}</span></a>
        <a href="{{ url_for('orders') }}">Orders</a>
        <a href="{{ url_for('admin') }}">Admin</a>
    </div>
</nav>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flash-wrap">
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<main>
{% block content %}{% endblock %}
</main>

<footer>
    <p>© 2026 K-Shop | Student E-Commerce Project</p>
</footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
