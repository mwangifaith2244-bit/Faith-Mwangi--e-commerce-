{% extends "base.html" %}

{% block title %}{{ product["name"] }} | VioletCart{% endblock %}

{% block content %}

<section class="product-detail">

    <div class="product-large">

        <img
            src="{{ url_for('static', filename=product['image']) }}"
            alt="{{ product['name'] }}"
        >

    </div>


    <div>

        <span class="tag">
            {{ product["category"] }}
        </span>

        <h1>
            {{ product["name"] }}
        </h1>

        <p>
            {{ product["description"] }}
        </p>

        <h2>
            KSh {{ "%.2f"|format(product["price"]) }}
        </h2>


        <form
            method="post"
            action="{{ url_for('add_to_cart', product_id=product['id']) }}"
        >

            <label>
                Quantity
            </label>

            <input
                class="qty"
                type="number"
                name="quantity"
                min="1"
                value="1"
            >

            <button
                class="btn"
                type="submit"
            >
                Add to Cart
            </button>

        </form>

    </div>

</section>

{% endblock %}
