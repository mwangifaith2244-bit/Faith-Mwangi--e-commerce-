{% extends "base.html" %}
{% block title %}K-Shop | Admin{% endblock %}
{% block content %}
<section class="section">
<h1>Admin — Product Management</h1>
<div class="admin-grid">
<form class="admin-form" method="post" action="{{ url_for('admin_add') }}">
<h2>Add Product</h2>
<input name="name" placeholder="Product name" required>
<input name="category" placeholder="Category" required>
<textarea name="description" placeholder="Description"></textarea>
<input name="price" type="number" step="0.01" placeholder="Price" required>
<input name="image" placeholder="Image filename">
<button class="btn" type="submit">Add Product</button>
</form>

<div>
<h2>Current Products</h2>
<table>
<tr><th>Name</th><th>Price</th><th>Action</th></tr>
{% for p in products %}
<tr>
<td>{{ p["name"] }}</td>
<td>KSh {{ "%.2f"|format(p["price"]) }}</td>
<td>
<form method="post" action="{{ url_for('admin_delete', product_id=p['id']) }}">
<button class="danger" type="submit" onclick="return confirm('Delete this product?')">Delete</button>
</form>
</td>
</tr>
{% endfor %}
</table>
</div>
</div>
</section>
{% endblock %}
